    <!-- Primary Meta: route-specific tags are injected at build time by scripts/prerender-meta.mjs -->

    <link rel="canonical" href="https://dm-labs.io/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Best Web Design Agency for Growing Businesses | DM Labs" />
    <meta property="og:description" content="Stand out. Build trust. Win more enquiries. Custom websites, fast delivery and personal care for businesses worldwide." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dm-labs.io/" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:alt" content="We build your website. Built for growth. DM Labs" />
    <meta property="og:site_name" content="DM-Labs.io" />

    <!-- Twitter Card -->

    <meta name="twitter:site" content="@dmlabs_io" />
    <meta name="twitter:title" content="Best Web Design Agency for Growing Businesses | DM Labs" />
    <meta name="twitter:description" content="Stand out. Build trust. Win more enquiries. Custom websites, fast delivery and personal care for businesses worldwide." />

    <link rel="preload" href="/fonts/brand-v1/open-sans-400-700.woff2" as="font" type="font/woff2" crossorigin />

  </head>
