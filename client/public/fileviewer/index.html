<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DM FileViewer</title>
<meta name="description" content="A fast, ad-free file and PDF viewer that shares straight to WhatsApp." />
<meta name="theme-color" content="#0F172A" />
<meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="/fileviewer/manifest.webmanifest" />
<link rel="icon" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FileViewer" />
<style>
  :root {
    --bg: #0F172A;
    --panel: #161f38;
    --panel-border: #263153;
    --fg: #E2E5EA;
    --muted: #93a0bd;
    --primary: #5B8CFF;
    --primary-fg: #FFFFFF;
    --danger: #ff6b6b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--panel-border);
    gap: 8px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  header .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  header .brand img { width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0; }
  #installBtn {
    display: none;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--fg);
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 16px;
    gap: 14px;
  }
  #dropzone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border: 2px dashed var(--panel-border);
    border-radius: 16px;
    padding: 32px 20px;
    text-align: center;
    color: var(--muted);
  }
  #dropzone.drag {
    border-color: var(--primary);
    background: rgba(91, 140, 255, 0.08);
  }
  #dropzone p { margin: 0; font-size: 14px; max-width: 320px; }
  button.primary {
    background: var(--primary);
    color: var(--primary-fg);
    border: none;
    border-radius: 12px;
    padding: 14px 22px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:active { opacity: 0.85; }
  #viewer { flex: 1; display: none; flex-direction: column; min-height: 0; gap: 12px; }
  #viewer.active { display: flex; }
  #dropzone.hidden { display: none; }
  #fileMeta {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 10px 12px;
  }
  #fileMeta .icon { font-size: 22px; }
  #fileMeta .info { min-width: 0; flex: 1; }
  #fileMeta .name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #fileMeta .sub { font-size: 12px; color: var(--muted); }
  #preview {
    flex: 1;
    min-height: 0;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #preview iframe, #preview embed, #preview video {
    width: 100%;
    height: 100%;
    border: none;
  }
  #preview img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  #preview audio { width: 100%; }
  #preview pre {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 14px;
    overflow: auto;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--fg);
    background: var(--panel);
  }
  #preview .unsupported {
    text-align: center;
    color: var(--muted);
    padding: 24px;
    font-size: 14px;
  }
  #shareList {
    display: none;
    flex-direction: column;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 10px;
  }
  #shareList.active { display: flex; }
  #shareList .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 6px;
    border-radius: 8px;
    background: transparent;
    border: none;
    color: var(--fg);
    text-align: left;
    font-size: 13px;
    cursor: pointer;
  }
  #shareList .item:active { background: rgba(255,255,255,0.06); }
  #shareList .item.selected { background: rgba(91,140,255,0.15); }
  .actions { display: flex; gap: 10px; }
  .actions button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
  }
  .actions button.accent {
    background: var(--primary);
    color: var(--primary-fg);
    border-color: var(--primary);
  }
  .actions button:disabled { opacity: 0.5; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: #1c2540;
    border: 1px solid var(--panel-border);
    color: var(--fg);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #toast.show { opacity: 1; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/favicon-32.png" alt="" />
      <h1>FileViewer</h1>
    </div>
    <button id="installBtn">Install app</button>
  </header>

  <main>
    <div id="shareList"></div>

    <div id="dropzone">
      <p>Open any file — PDF, photo, video, or document — with no ads. View it, then share it straight to WhatsApp.</p>
      <button class="primary" id="openBtn">Open a file</button>
      <input type="file" id="fileInput" />
    </div>

    <div id="viewer">
      <div id="fileMeta">
        <div class="icon" id="fileIcon">📄</div>
        <div class="info">
          <div class="name" id="fileName"></div>
          <div class="sub" id="fileSub"></div>
        </div>
      </div>
      <div id="preview"></div>
      <div class="actions">
        <button id="shareBtn" class="accent">Share</button>
        <button id="downloadBtn">Download</button>
        <button id="closeBtn">Close</button>
      </div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    const dropzone = document.getElementById("dropzone");
    const viewer = document.getElementById("viewer");
    const fileInput = document.getElementById("fileInput");
    const openBtn = document.getElementById("openBtn");
    const preview = document.getElementById("preview");
    const fileIcon = document.getElementById("fileIcon");
    const fileName = document.getElementById("fileName");
    const fileSub = document.getElementById("fileSub");
    const shareBtn = document.getElementById("shareBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const closeBtn = document.getElementById("closeBtn");
    const installBtn = document.getElementById("installBtn");
    const shareListEl = document.getElementById("shareList");
    const toast = document.getElementById("toast");

    let currentFile = null;
    let currentUrl = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function iconFor(name, type) {
      const ext = (name.split(".").pop() || "").toLowerCase();
      if (type.startsWith("image/")) return "🖼️";
      if (type === "application/pdf") return "📕";
      if (type.startsWith("video/")) return "🎬";
      if (type.startsWith("audio/")) return "🎵";
      if (["doc", "docx"].includes(ext)) return "📝";
      if (["xls", "xlsx", "csv"].includes(ext)) return "📊";
      if (["ppt", "pptx"].includes(ext)) return "📽️";
      if (["zip", "rar", "7z"].includes(ext)) return "🗜️";
      if (type.startsWith("text/")) return "📃";
      return "📄";
    }

    async function renderPreview(file) {
      preview.innerHTML = "";
      const type = file.type || "";
      const ext = (file.name.split(".").pop() || "").toLowerCase();

      if (type === "application/pdf" || ext === "pdf") {
        const embed = document.createElement("embed");
        embed.src = currentUrl;
        embed.type = "application/pdf";
        preview.appendChild(embed);
        return;
      }
      if (type.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = currentUrl;
        preview.appendChild(img);
        return;
      }
      if (type.startsWith("video/")) {
        const video = document.createElement("video");
        video.src = currentUrl;
        video.controls = true;
        video.playsInline = true;
        preview.appendChild(video);
        return;
      }
      if (type.startsWith("audio/")) {
        const audio = document.createElement("audio");
        audio.src = currentUrl;
        audio.controls = true;
        preview.appendChild(audio);
        return;
      }
      if (type.startsWith("text/") || ["json", "csv", "md", "log", "js", "ts", "css", "html", "xml", "yml", "yaml"].includes(ext)) {
        try {
          const slice = file.slice(0, 200000);
          const text = await slice.text();
          const pre = document.createElement("pre");
          pre.textContent = text + (file.size > 200000 ? "\n\n… (truncated preview)" : "");
          preview.appendChild(pre);
          return;
        } catch (e) {
          // fall through to unsupported
        }
      }
      const div = document.createElement("div");
      div.className = "unsupported";
      div.textContent = "No inline preview for this file type — you can still share or download it below.";
      preview.appendChild(div);
    }

    async function openFile(file) {
      if (!file) return;
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentFile = file;
      currentUrl = URL.createObjectURL(file);
      fileIcon.textContent = iconFor(file.name, file.type || "");
      fileName.textContent = file.name || "Untitled file";
      fileSub.textContent = `${formatSize(file.size)}${file.type ? " · " + file.type : ""}`;
      await renderPreview(file);
      dropzone.classList.add("hidden");
      viewer.classList.add("active");
      updateShareAvailability();
    }

    function closeFile() {
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = null;
      currentFile = null;
      preview.innerHTML = "";
      viewer.classList.remove("active");
      dropzone.classList.remove("hidden");
      fileInput.value = "";
    }

    function updateShareAvailability() {
      const canShareFiles = !!(navigator.canShare && currentFile && navigator.canShare({ files: [currentFile] }));
      shareBtn.style.display = canShareFiles ? "" : "none";
    }

    openBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) openFile(file);
    });

    ["dragenter", "dragover"].forEach((evt) =>
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.add("drag");
      }),
    );
    ["dragleave", "drop"].forEach((evt) =>
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropzone.classList.remove("drag");
      }),
    );
    dropzone.addEventListener("drop", (e) => {
      const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) openFile(file);
    });

    shareBtn.addEventListener("click", async () => {
      if (!currentFile) return;
      try {
        await navigator.share({ files: [currentFile], title: currentFile.name });
      } catch (err) {
        if (err && err.name !== "AbortError") showToast("Couldn't open the share sheet.");
      }
    });

    downloadBtn.addEventListener("click", () => {
      if (!currentUrl || !currentFile) return;
      const a = document.createElement("a");
      a.href = currentUrl;
      a.download = currentFile.name || "file";
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    closeBtn.addEventListener("click", closeFile);

    // ── Install prompt (Android "Add to Home Screen") ──
    let deferredInstall = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredInstall = e;
      installBtn.style.display = "inline-block";
    });
    installBtn.addEventListener("click", async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      deferredInstall = null;
      installBtn.style.display = "none";
    });
    window.addEventListener("appinstalled", () => {
      installBtn.style.display = "none";
      showToast("Installed. Find it on your home screen.");
    });

    // ── Service worker + shared-file handoff ──
    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("fileviewer-share", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("shared");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function consumeSharedFiles() {
      const db = await openDb();
      const entry = await new Promise((resolve, reject) => {
        const tx = db.transaction("shared", "readwrite");
        const store = tx.objectStore("shared");
        const getReq = store.get("latest");
        getReq.onsuccess = () => resolve(getReq.result);
        getReq.onerror = () => reject(getReq.error);
        store.delete("latest");
      });
      db.close();
      return entry;
    }

    function renderShareList(files) {
      shareListEl.innerHTML = "";
      shareListEl.classList.add("active");
      files.forEach((file, i) => {
        const btn = document.createElement("button");
        btn.className = "item" + (i === 0 ? " selected" : "");
        btn.textContent = `${iconFor(file.name, file.type || "")}  ${file.name} · ${formatSize(file.size)}`;
        btn.addEventListener("click", () => {
          shareListEl.querySelectorAll(".item").forEach((el) => el.classList.remove("selected"));
          btn.classList.add("selected");
          openFile(file);
        });
        shareListEl.appendChild(btn);
      });
    }

    async function init() {
      if ("serviceWorker" in navigator) {
        try {
          await navigator.serviceWorker.register("/fileviewer/sw.js", { scope: "/fileviewer/" });
        } catch (e) {
          // Installable/offline features degrade gracefully without it.
        }
      }

      const params = new URLSearchParams(location.search);
      if (params.get("shared") === "1") {
        try {
          const entry = await consumeSharedFiles();
          const files = entry && entry.files ? entry.files.filter((f) => f instanceof File) : [];
          if (files.length === 1) {
            await openFile(files[0]);
          } else if (files.length > 1) {
            renderShareList(files);
            await openFile(files[0]);
          } else {
            showToast("Nothing came through — try sharing the file again.");
          }
        } catch (e) {
          showToast("Couldn't read the shared file.");
        }
        history.replaceState(null, "", "/fileviewer/");
      }
    }

    init();
  </script>
</body>
</html>
