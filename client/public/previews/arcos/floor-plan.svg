<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
<title id="title">Courtyard House, furnished concept plan</title>
<desc id="desc">A U-shaped single-storey home. Kitchen and dining connect the living wing on the west to a bathroom and two bedrooms on the east. A continuous passage serves both bedrooms. Sliding glass opens the living and dining spaces onto a central olive-tree courtyard. Schematic, not to scale.</desc>
<defs>
 <pattern id="gravel" width="16" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".65" fill="#b9b5a4"/><circle cx="12" cy="13" r=".8" fill="#c8c4b6"/></pattern>
 <pattern id="paving" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d9d6cb" stroke-width=".6"/></pattern>
 <pattern id="timber" width="8" height="10" patternUnits="userSpaceOnUse"><path d="M0 0V10" stroke="#d8d0bd" stroke-width=".7"/></pattern>
</defs>
<path d="M50 45H750V606H50Z" fill="#e7e6dc"/>
<path d="M68 54H734V600H68Z" fill="url(#gravel)"/>
<!-- Interior floors and the open court remain separate, legible areas. -->
<path d="M80 70H720V580H530V250H270V580H80Z" fill="#f8f6ef"/>
<path d="M80 70H720V250H270V580H80Z" fill="url(#paving)"/>
<path d="M583 253H708V568H583Z" fill="url(#timber)"/>
<rect x="278" y="258" width="244" height="318" fill="url(#gravel)"/>
