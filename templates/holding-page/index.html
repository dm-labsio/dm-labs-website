<style>
/* ---------- tokens: D&M Labs brand ---------------------------------- */
:root{
  --base:#F6F6F4;
  --ink:#111315;
  --ink-soft:#5B6472;
  --dark:#0F172A;
  --card:#FFFFFF;
  --line:#E2E5EA;
  --surface:#F1F3F7;
  --blue:#5B8CFF;
  --cyan:#6FE3FF;
  --violet:#8B5CFF;
  --gradient:linear-gradient(135deg,#5B8CFF 0%,#6FE3FF 50%,#8B5CFF 100%);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sans-he:"Heebo","Inter",Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

body{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  background:var(--base);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.6;
  overflow-x:hidden;
}
html[dir="rtl"] body{font-family:var(--sans-he)}

/* ---------- ambient brand aura -------------------------------------- */
.aura{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.aura span{
  position:absolute;
  display:block;
  border-radius:50%;
  filter:blur(70px);
  opacity:.42;
}
.aura .a1{
  width:min(58vw,460px);aspect-ratio:1;
  top:-14%;right:-12%;
  background:radial-gradient(circle,var(--cyan) 0%,var(--blue) 55%,transparent 72%);
  animation:drift-a 22s ease-in-out infinite;
}
.aura .a2{
  width:min(52vw,420px);aspect-ratio:1;
  bottom:-16%;left:-10%;
  background:radial-gradient(circle,var(--violet) 0%,var(--blue) 58%,transparent 74%);
  animation:drift-b 26s ease-in-out infinite;
}
@keyframes drift-a{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%    {transform:translate3d(-4%,5%,0) scale(1.09)}
}
@keyframes drift-b{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%    {transform:translate3d(5%,-4%,0) scale(1.07)}
}
@media (min-width:768px){ .aura span{filter:blur(96px);opacity:.46} }

/* ---------- card ----------------------------------------------------- */
.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:600px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:28px;
  padding:40px 24px 32px;
  text-align:center;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 18px 44px -12px rgba(15,23,42,.13);
  overflow:hidden;
  animation:rise .7s cubic-bezier(.22,1,.36,1) both;
}
.card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:4px;
  background:var(--gradient);
}
@keyframes rise{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
@media (min-width:480px){ .card{padding:52px 44px 40px} }
@media (min-width:768px){ .card{padding:60px 56px 44px;border-radius:32px} }

/* ---------- logo ------------------------------------------------------ */
.logo{
  width:clamp(158px,44vw,208px);
  height:auto;
  display:block;
  margin:0 auto;
}

/* ---------- status pill ---------------------------------------------- */
.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:28px;
  padding:7px 14px;
  border-radius:999px;
  background:var(--surface);
  border:1px solid var(--line);
  font-size:13px;
  font-weight:500;
  line-height:1.4;
  color:var(--ink-soft);
}
.dot{
  width:8px;height:8px;
  flex:none;
  border-radius:50%;
  background:var(--gradient);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

/* ---------- copy ------------------------------------------------------ */
h1{
  margin:18px 0 0;
  font-size:clamp(25px,6vw,35px);
  font-weight:700;
  line-height:1.22;
  letter-spacing:-.02em;
  color:var(--ink);
  text-wrap:balance;
}
html[dir="rtl"] h1{letter-spacing:normal}

.lede{
  margin:16px auto 0;
  max-width:42ch;
  font-size:clamp(15px,3.6vw,16.5px);
  line-height:1.75;
  color:var(--ink-soft);
  text-wrap:pretty;
}

.project{
  margin:24px auto 0;
  padding-top:20px;
  border-top:1px solid var(--line);
  font-size:13px;
  color:var(--ink-soft);
}
.project b{
  display:block;
  margin-top:4px;
  font-size:15px;
  font-weight:600;
  color:var(--ink);
}

/* ---------- actions --------------------------------------------------- */
.actions{
  margin-top:28px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
@media (min-width:480px){ .actions{flex-direction:row;justify-content:center;gap:12px} }

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  min-height:48px;
  padding:0 22px;
  border-radius:999px;
  border:1px solid transparent;
  font-family:inherit;
  font-size:15px;
  font-weight:600;
  text-decoration:none;
  white-space:nowrap;
  cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease;
}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{
  background:var(--dark);
  color:#fff;
  box-shadow:0 8px 20px -8px rgba(15,23,42,.55);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px rgba(15,23,42,.6)}
.btn-secondary{
  background:#fff;
  color:var(--ink);
  border-color:var(--line);
}
.btn-secondary:hover{transform:translateY(-2px);border-color:var(--blue);background:#FAFBFF}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* ---------- footer ---------------------------------------------------- */
.foot{
  margin-top:28px;
  padding-top:20px;
  border-top:1px solid var(--line);
  font-size:13px;
  color:var(--ink-soft);
}
.foot a{
  color:var(--ink);
  font-weight:600;
  text-decoration:none;
  border-bottom:1.5px solid transparent;
  background-image:var(--gradient);
  background-repeat:no-repeat;
  background-position:0 100%;
  background-size:0 1.5px;
  transition:background-size .3s ease;
  padding-bottom:2px;
}
.foot a:hover{background-size:100% 1.5px}
.foot a:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}

/* ---------- language chips -------------------------------------------- */
.langs{
  position:relative;
  z-index:1;
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:6px;
}
.langs button{
  appearance:none;
  min-height:34px;
  padding:0 13px;
  border-radius:999px;
  border:1px solid transparent;
  background:transparent;
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  color:var(--ink-soft);
  cursor:pointer;
  transition:color .2s ease,background-color .2s ease,border-color .2s ease;
}
.langs button:hover{color:var(--ink);background:rgba(255,255,255,.7)}
.langs button[aria-current="true"]{
  color:var(--ink);
  background:#fff;
  border-color:var(--line);
  font-weight:600;
}
.langs button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- layout wrapper -------------------------------------------- */
.wrap{position:relative;z-index:1;width:100%;max-width:600px}

/* ---------- reduced motion -------------------------------------------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .card{opacity:1;transform:none}
}
</style>
</head>

          <path d="M12.04 2C6.6 2 2.2 6.4 2.2 11.84c0 1.74.46 3.44 1.32 4.94L2.1 22l5.35-1.4a9.8 9.8 0 0 0 4.59 1.17h.01c5.43 0 9.84-4.41 9.84-9.84C21.89 6.4 17.47 2 12.04 2Zm0 18.02h-.01a8.2 8.2 0 0 1-4.16-1.14l-.3-.18-3.17.83.85-3.1-.2-.32a8.15 8.15 0 0 1-1.25-4.36c0-4.52 3.68-8.19 8.2-8.19a8.18 8.18 0 0 1 8.18 8.2c0 4.52-3.67 8.19-8.14 8.19Zm4.49-6.13c-.24-.12-1.45-.72-1.68-.8-.22-.08-.39-.12-.55.12s-.63.8-.77.96-.28.18-.52.06a6.7 6.7 0 0 1-1.97-1.22 7.4 7.4 0 0 1-1.37-1.7c-.14-.24-.01-.37.11-.49.11-.11.24-.28.36-.42.12-.15.16-.25.24-.41.08-.17.04-.31-.02-.43-.06-.12-.55-1.33-.76-1.82-.2-.47-.4-.41-.55-.42h-.47a.9.9 0 0 0-.65.31c-.22.24-.86.84-.86 2.05s.88 2.38 1 2.54c.12.17 1.73 2.64 4.2 3.7.58.26 1.04.41 1.4.52.59.19 1.13.16 1.55.1.47-.07 1.45-.59 1.66-1.17.2-.57.2-1.06.14-1.16-.06-.11-.22-.17-.46-.29Z"/>

</div>

<script>
(function () {
  "use strict";

  var T = {
    he: {
      dir: "rtl",
      docTitle: "D&M Labs — הסביבה מושהית",
      status: "הפרויקט אינו פעיל כעת",
      title: "הסביבה מושהית זמנית",
      body: "האתר וחומרי הפרויקט מנוהלים על ידי D&M Labs ואינם זמינים לצפייה כרגע. לחידוש הגישה או לכל שאלה אחרת — נשמח לשמוע מכם.",
      projectLabel: "פרויקט",
      ctaMail: "שלחו לנו מייל",
      ctaWa: "וואטסאפ",
      footLead: "עיצוב ופיתוח דיגיטלי",
      waText: "שלום D&M Labs, אשמח לדבר לגבי הפרויקט.",
      chip: "עברית"
    },
    en: {
      dir: "ltr",
      docTitle: "D&M Labs — Environment paused",
      status: "This project is currently inactive",
      title: "This environment is temporarily paused",
      body: "The site and project materials are managed by D&M Labs and are not available to view right now. To restore access, or for anything else — we'd be glad to hear from you.",
      projectLabel: "Project",
      ctaMail: "Email us",
      ctaWa: "WhatsApp",
      footLead: "Digital design & development",
      waText: "Hi D&M Labs, I'd like to talk about the project.",
      chip: "English"
    },
    el: {
      dir: "ltr",
      docTitle: "D&M Labs — Το περιβάλλον σε παύση",
      status: "Το έργο είναι προς το παρόν ανενεργό",
      title: "Το περιβάλλον βρίσκεται προσωρινά σε παύση",
      body: "Ο ιστότοπος και το υλικό του έργου διαχειρίζονται από την D&M Labs και δεν είναι διαθέσιμα αυτή τη στιγμή. Για επαναφορά της πρόσβασης ή για οτιδήποτε άλλο — θα χαρούμε να επικοινωνήσετε μαζί μας.",
      projectLabel: "Έργο",
      ctaMail: "Στείλτε μας email",
      ctaWa: "WhatsApp",
      footLead: "Ψηφιακός σχεδιασμός & ανάπτυξη",
      waText: "Γεια σας D&M Labs, θα ήθελα να συζητήσουμε για το έργο.",
      chip: "Ελληνικά"
    }
  };

  var cfg = window.CONFIG || {};
  var order = ["he", "en", "el"];
  var current = T[cfg.lang] ? cfg.lang : "he";

  var nav = document.querySelector(".langs");

  function apply(code) {
    var t = T[code];
    if (!t) return;
    current = code;

    document.documentElement.lang = code;
    document.documentElement.dir = t.dir;
    document.title = t.docTitle;

    document.querySelectorAll("[data-t]").forEach(function (el) {
      var key = el.getAttribute("data-t");
      if (key === "projectName") { el.textContent = cfg.projectName || ""; return; }
      if (t[key] != null) el.textContent = t[key];
    });

    var project = document.querySelector(".project");
    if (project) project.hidden = !cfg.projectName;

    var subject = (cfg.projectName ? cfg.projectName + " — " : "") + t.title;
    var mail = document.querySelector('[data-act="mail"]');
    if (mail) mail.href = "mailto:" + (cfg.email || "") + "?subject=" + encodeURIComponent(subject);

    var wa = document.querySelector('[data-act="wa"]');
    if (wa) {
      if (cfg.whatsapp) {
        wa.href = "https://wa.me/" + cfg.whatsapp + "?text=" + encodeURIComponent(t.waText);
        wa.hidden = false;
      } else {
        wa.hidden = true;
      }
    }

    var site = document.querySelector('[data-act="site"]');
    if (site) {
      site.href = cfg.website || "#";
      site.textContent = cfg.websiteLabel || cfg.website || "";
    }

    if (nav) {
      nav.querySelectorAll("button").forEach(function (b) {
        b.setAttribute("aria-current", String(b.dataset.lang === code));
      });
    }
  }

  if (nav && cfg.showLangSwitch !== false) {
    nav.hidden = false;
    order.forEach(function (code) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.lang = code;
      b.textContent = T[code].chip;
      b.addEventListener("click", function () { apply(code); });
      nav.appendChild(b);
    });
  }

  apply(current);
})();
</script>
</body>
</html>
